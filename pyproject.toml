[project]
name = "isla"
version = "0.1.0"
description = "ISLA — open-source virality radar. Detects what is about to go viral, from real signals, before the peak."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
llm = ["anthropic>=0.30"]

[project.scripts]
isla = "isla.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
