[project]
name = "isla"
version = "0.2.0"
description = "ISLA — open-source global viral intelligence network. Detects what is about to go viral, from real signals, before the peak — with live SSE stream, provenance and explainability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.52",
]

[project.optional-dependencies]
serve = ["fastapi>=0.141.1", "uvicorn>=0.52.4"]
llm = ["anthropic>=1.2.0"]

[project.scripts]
isla = "isla.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
